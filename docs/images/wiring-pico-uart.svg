<svg viewBox="0 0 780 366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four wires between the SKR Pico UART header and the ESP32-S3: 5V and GND straight across, Pico TX0 to ESP RX GP44, ESP TX GP43 to Pico RX0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5"><rect width="780" height="366" fill="#f2f3f0"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect x="30" y="50" width="240" height="220" rx="8" fill="#dcc9a4" fill-opacity="0.35" stroke="#1c2421" stroke-width="1.5"/><text x="50" y="76" fill="#1c2421" font-weight="600">BTT SKR Pico</text><text x="50" y="94" fill="#66706b" font-size="11.5">UART header, printer board side</text><text x="50" y="112" fill="#66706b" font-size="11">runs the skr-pico-uart firmware</text><rect x="510" y="50" width="240" height="220" rx="8" fill="#2b5d8f" fill-opacity="0.22" stroke="#2b5d8f" stroke-width="2"/><text x="530" y="76" fill="#1c2421" font-weight="600">ESP32-S3 on the stripboard</text><text x="530" y="94" fill="#66706b" font-size="11.5">sockets: 5V, GND left · TX, RX right</text><rect x="264" y="122" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="252" y="134" text-anchor="end" fill="#1c2421" font-weight="600">5V</text><rect x="500" y="122" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="528" y="134" fill="#1c2421" font-weight="600">5V</text><text x="528" y="147" fill="#66706b" font-size="10">left socket, row 1</text><line x1="282" y1="130" x2="498" y2="130" stroke="#1c2421" stroke-width="7" stroke-linecap="butt"/><line x1="282" y1="130" x2="498" y2="130" stroke="#d62d20" stroke-width="4"/><rect x="264" y="162" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="252" y="174" text-anchor="end" fill="#1c2421" font-weight="600">GND</text><rect x="500" y="162" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="528" y="174" fill="#1c2421" font-weight="600">GND</text><text x="528" y="187" fill="#66706b" font-size="10">left socket, row 2</text><line x1="282" y1="170" x2="498" y2="170" stroke="#1c2421" stroke-width="7" stroke-linecap="butt"/><line x1="282" y1="170" x2="498" y2="170" stroke="#15191a" stroke-width="4"/><rect x="264" y="202" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="252" y="214" text-anchor="end" fill="#1c2421" font-weight="600">TX0</text><text x="252" y="227" text-anchor="end" fill="#66706b" font-size="10">RP2040 GPIO0</text><rect x="500" y="202" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="528" y="214" fill="#1c2421" font-weight="600">RX  GP44</text><text x="528" y="227" fill="#66706b" font-size="10">right socket, row 2</text><line x1="282" y1="210" x2="498" y2="210" stroke="#1c2421" stroke-width="7" stroke-linecap="butt"/><line x1="282" y1="210" x2="498" y2="210" stroke="#2f6fd6" stroke-width="4"/><polygon points="498,210 486,203 486,217" fill="#1c2421"/><rect x="264" y="242" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="252" y="254" text-anchor="end" fill="#1c2421" font-weight="600">RX0</text><text x="252" y="267" text-anchor="end" fill="#66706b" font-size="10">RP2040 GPIO1</text><rect x="500" y="242" width="16" height="16" rx="3" fill="#fafaf8" stroke="#1c2421" stroke-width="1.6"/><text x="528" y="254" fill="#1c2421" font-weight="600">TX  GP43</text><text x="528" y="267" fill="#66706b" font-size="10">right socket, row 1</text><line x1="498" y1="250" x2="282" y2="250" stroke="#1c2421" stroke-width="7" stroke-linecap="butt"/><line x1="498" y1="250" x2="282" y2="250" stroke="#2e9e4f" stroke-width="4"/><polygon points="282,250 294,243 294,257" fill="#1c2421"/><text x="390" y="114" text-anchor="middle" fill="#66706b" font-size="11">power, 5 V from the board</text><text x="390" y="196" text-anchor="middle" fill="#66706b" font-size="11">data, 250000 baud, 3.3 V logic</text><text x="390" y="294" text-anchor="middle" fill="#1c2421" font-size="12" font-weight="600">TX always goes to RX</text><rect x="30" y="322" width="720" height="34" rx="6" fill="none" stroke="#c23b22" stroke-width="1.4" stroke-dasharray="5 4"/><text x="390" y="343" text-anchor="middle" fill="#1c2421" font-size="12">Pad order shown here is not read off a real board. Match each wire to the name printed beside the Pico header.</text></svg>