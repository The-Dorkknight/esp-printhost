# printer.cfg: QIDI X-Smart 3 (CoreXY) rebuilt around a BTT SKR Pico + Skipper Flipper (ESP32-S3).
# 2026-10-27, NOT YET TRIED ON THE PRINTER. Needs the CAPTAIN or SKIPPER build of 2026-10-27 or later
# (CoreXY, homing on the probe, gear_ratio, the ESP32 chamber sensor).
# Mechanics, currents and offsets from QIDI's own X-Smart 3 printer.cfg (firmware 4.1.13, as kept in
# github.com/billkenney/qidi_3series_recovery); pins are the SKR Pico's (Klipper's SKR Pico config).
# The stock toolhead board (MKS THR) and mainboard are replaced, so everything that was on them is
# wired to the SKR Pico instead: see docs/configs/qidi-xsmart3-skr-pico.md for the wiring and checks.
# BEFORE THE FIRST POWER-UP: check the supply voltage, the bed heater current and the probe voltage
# (the .md). Before the first G28: check every motor direction with the Test bench.

[mcu]
serial: uart

[printer]
kinematics: corexy
# QIDI ships 600 mm/s and 20000 mm/s^2; start well below that until this host has been proven on it
max_velocity: 300
max_accel: 5000
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 8

[homing_override]
# QIDI's order: X, back off, Y, back off, then the probe over the middle of the bed, then Z up.
# Z is unknown at power-up: assumed 0, lifted 5 mm first so the nozzle clears the bed.
axes: xyz
set_position_z: 0
gcode:
  G91
  G1 Z5 F600
  G90
  G28 X
  G1 X10 F1200
  G28 Y
  G1 Y10 F1200
  G1 X61.5 Y89 F6000
  G28 Z
  G1 Z10 F600

# ---- motors: motor A = stepper_x (SKR Pico X socket), motor B = stepper_y (Y socket).
# The directions below are a guess: check with the Test bench motor test before homing (see the .md).
[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 39.96
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5.5
position_endstop: -4.5
position_max: 177
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
# QIDI: 1.07 A printing, 0.8 A while homing X; start at 0.8 (one current here), raise once it homes
run_current: 0.800
interpolate: True
stealthchop_threshold: 0
diag_pin: ^gpio4
driver_SGTHRS: 100

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 39.96
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -5.5
position_endstop: -4.5
position_max: 185
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
# QIDI: 1.07 A printing, 0.9 A while homing Y
run_current: 0.800
interpolate: True
stealthchop_threshold: 0
diag_pin: ^gpio3
driver_SGTHRS: 100

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
# Z homes on the inductive probe, over the middle of the bed (see [homing_override])
endstop_pin: probe:z_virtual_endstop
position_min: -6
position_max: 175
homing_speed: 8
second_homing_speed: 4
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
# QIDI's own value (a small Z motor on a lead screw); raise towards 0.4 if Z skips
run_current: 0.200
interpolate: True
stealthchop_threshold: 1200

[probe]
# QIDI's inductive probe, was on the toolhead board (pin ^!gpio21 there): now on the SKR Pico's
# PROBE header (gpio22). CHECK THE VOLTAGE FIRST: the RP2040 takes 3.3 V at most on this pin (.md).
pin: ^!gpio22
x_offset: 27
y_offset: 3.5
# Height of the nozzle when the probe triggers: find it with the paper test (the .md), then set it here
z_offset: 0.0
speed: 5
lift_speed: 8

# ---- extruder: QIDI's geared extruder (9.5:1)
[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 53.5
gear_ratio: 9.5:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
# QIDI uses a thermocouple through a MAX6675 on the (dead) toolhead board; the SKR Pico has no
# thermocouple input. Fit a 100K cartridge thermistor rated for the temperature you print at
# (ATC Semitec 104GT-2: up to 300 C) on TH0 and keep max_temp below its rating.
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio27
min_temp: 0
max_temp: 290
min_extrude_temp: 175
# QIDI's PID was for the thermocouple: run "PID tune hotend" on the Test bench, then Save PID
control: pid
pid_Kp: 14.734
pid_Ki: 6.549
pid_Kd: 8.288
pressure_advance: 0.032
pressure_advance_smooth_time: 0.030
max_extrude_only_distance: 120

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.714
interpolate: True
stealthchop_threshold: 0

[heater_bed]
heater_pin: gpio21
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: gpio26
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 3
heating_gain: 1

# ---- fans: the SKR Pico has three fan outputs (they switch the supply voltage: 24 V fans on a 24 V supply)
[fan]
# part cooling fan (was on the toolhead board)
pin: gpio17

[heater_fan hotend_fan]
# both hotend fans (were on the toolhead board), in parallel: together under 1 A
pin: gpio18
heater: extruder
heater_temp: 50.0

[heater_fan board_fan]
# the electronics fan (QIDI runs it with the hotend). The side (auxiliary) fan and the chamber fan
# have no output left: leave them unplugged for now.
pin: gpio20
heater: extruder
heater_temp: 50.0

# ---- extras
[temperature_sensor chamber]
# a 100K thermistor on the ESP32 itself (docs/CHAMBER_SENSOR.md): 100 kohm from 3V3 to GPIO7
sensor_type: Generic 3950
sensor_pin: esp32:gpio7

[bed_mesh]
# probe positions (QIDI: 30,15 to 170,170, 4 x 4)
mesh_min: 30, 15
mesh_max: 170, 170
probe_count: 4, 4
horizontal_move_z: 10

[neopixel board_led]
pin: gpio24
chain_count: 1
color_order: GRB
initial_GREEN: 0.15
