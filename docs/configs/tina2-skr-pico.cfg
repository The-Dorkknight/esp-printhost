# printer.cfg: WEEDO Tina 2 + BTT SKR Pico + Skipper Flipper. Tuned on the author's
# Tina 2 (2026-10-20): X flipped, run_current 0.7, sensorless X/Y. Needs the CAPTAIN or
# DECKHAND build from 2026-10-20 night or later ([homing_override] support).
# 2026-10-27: heated bed added (the author's Tina 2 has one, about 120 x 120 mm) and homing
# reordered: X, X back to the middle, Y, Y back to the middle, then Z down onto the middle of the
# bed (before, Z could come down while the bed was far off to one side and miss it), lift 10 mm.
# NOT YET TRIED ON THE PRINTER. CLEAR THE BED FIRST; keep a hand on the power switch.
# Tune Z with the Test bench "Hard stop" button before G28.
# Then fine-tune Z: jog down to a sheet of paper and set position_endstop to minus the Z shown.
[mcu]
serial: uart

[printer]
kinematics: cartesian
max_velocity: 97
max_accel: 1000
max_z_velocity: 10
max_z_accel: 250

[homing_override]
# Lift first (Z is unknown before homing: assumed 0, so this goes 3 mm up from wherever it is).
# Then X, and X straight back to the middle; Y, and Y straight back to the middle; so the nozzle
# is over the middle of the bed before Z comes down onto it (a corner flexes, an edge misses).
# Middle = halfway between position_min and position_max below (X 5-85, Y 0-105).
axes: xyz
set_position_z: 0
gcode:
  G91
  G1 Z3 F300
  G90
  G28 X
  G1 X45 F3000
  G28 Y
  G1 Y52 F3000
  G28 Z
  G1 Z10 F600

[stepper_x]
step_pin: gpio11
# flipped (was !gpio10): X ran the wrong way on the author's Tina 2
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 85
position_min: 5
position_max: 85
homing_speed: 16
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.700
stealthchop_threshold: 999999
diag_pin: ^gpio4
driver_SGTHRS: 32

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 105
homing_speed: 16
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.700
stealthchop_threshold: 999999
diag_pin: ^gpio3
driver_SGTHRS: 30

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: -2
position_max: 80
homing_speed: 5
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.700
stealthchop_threshold: 999999
diag_pin: ^gpio25
# was 42 homing up; re-tune pushing down onto the bed
driver_SGTHRS: 42

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 33.725
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 41.141
pid_Ki: 2.716
pid_Kd: 155.822
min_temp: 0
max_temp: 240

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.500
stealthchop_threshold: 999999

[heater_bed]
# SKR Pico "HB" output and "THB" thermistor input (Klipper's SKR Pico config: gpio21 / gpio26).
# ASSUMED: the bed is wired to those two terminals and has the common 100K "3950" thermistor
# (most add-on beds; if the temperature reads clearly wrong at room temperature, it is another type).
# watermark (on/off) until tuned: run "PID tune bed" on the Test bench, then Save PID.
# A 120 x 120 mm 12 V bed takes about 3-5 A: check the power supply can feed it and the hotend.
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio26
control: watermark
min_temp: 0
max_temp: 100

[probe]
pin: tmc2209_stepper_z:virtual_endstop
z_offset: 0
speed: 2

[fan]
pin: gpio17

[heater_fan hotend_fan]
pin: gpio18

[heater_fan fan3]
pin: gpio20

[neopixel board_led]
pin: gpio24
chain_count: 1
color_order: GRB
initial_GREEN: 0.15
